services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitarbeiter
      POSTGRES_PASSWORD: mitarbeiter
      POSTGRES_DB: mitarbeiter_app
    ports:
      - "5432:5432"
    volumes:
      - mitarbeiter_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitarbeiter -d mitarbeiter_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mitarbeiter_postgres_data:
